<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMeter & EcoFlow Live-Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 750px;
            border: 1px solid #2d2d2d;
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #ffffff;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .serial {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: -5px;
            margin-bottom: 25px;
        }
        .top-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-main {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background: #252525;
            border: 1px solid #2d2d2d;
        }
        .metric-main label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0a0a0;
        }
        .metric-main .value {
            font-size: 38px;
            font-weight: bold;
            margin-top: 5px;
            transition: color 0.3s ease;
        }
        .eco-sub-container {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .eco-sub {
            text-align: center;
        }
        .eco-sub label {
            font-size: 12px;
            color: #888;
        }
        .eco-sub .sub-val {
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            margin-top: 5px;
        }
        .eco-sub .sub-val.solar { color: #f1c40f; } 
        .eco-sub .sub-val.battery { color: #2ecc71; } 

        .grid-sub {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .metric-sub {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            border-left-width: 4px;
        }
        .metric-sub.l1 { border-left-color: #3498db; }
        .metric-sub.l2 { border-left-color: #9b59b6; }
        .metric-sub.l3 { border-left-color: #e67e22; }
        
        .metric-sub label {
            font-size: 12px;
            color: #a0a0a0;
            display: block;
        }
        .metric-sub .value {
            font-size: 18px;
            font-weight: 600;
            margin-top: 3px;
            color: #ffffff;
        }
        .total {
            grid-column: span 3;
            border-left-color: #2ecc71;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chart-container {
            position: relative;
            margin: 20px 0;
            height: 250px;
            width: 100%;
        }
        .status {
            font-size: 11px;
            text-align: center;
            color: #777777;
            margin-top: 20px;
        }
        .loading { color: #a0a0a0 !important; }
        .consumption { color: #ff6b6b; } 
        .delivery { color: #2ecc71; }   
    </style>
</head>
<body>

<div class="card">
    <h1>System Status <span style="font-size: 14px; color: #a0a0a0; align-self: flex-end;">Live</span></h1>
    <div class="serial">Reader-ID: <span id="serial">-</span></div>

    <div class="top-metrics">
        <div class="metric-main">
            <label>Current Grid Power</label>
            <div id="current-power" class="value loading">Loading...</div>
        </div>

        <div class="metric-main">
            <label>EcoFlow Status</label>
            <div class="eco-sub-container">
                <div class="eco-sub">
                    <label>PV-Power</label>
                    <div id="pv-power" class="sub-val solar">-- W</div>
                </div>
                <div class="eco-sub">
                    <label>Battery</label>
                    <div id="battery-soc" class="sub-val battery">-- %</div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid-sub">
        <div class="metric-sub l1">
            <label>Phase L1</label>
            <div id="power-l1" class="value">-</div>
        </div>
        <div class="metric-sub l2">
            <label>Phase L2</label>
            <div id="power-l2" class="value">-</div>
        </div>
        <div class="metric-sub l3">
            <label>Phase L3</label>
            <div id="power-l3" class="value">-</div>
        </div>
        <div class="metric-sub total">
            <span>Total Energy Consumed:</span>
            <span id="total-consumption" class="value" style="margin: 0;">-</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="historyChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="ecoChart"></canvas>
    </div>

    <div class="status">Latest update: <span id="timestamp">Never</span></div>
</div>

<script>
    const dataUrl = '/data'; 
    const MAX_DATA_POINTS = 900; 

    const ctx1 = document.getElementById('historyChart').getContext('2d');
    const historyChart = new Chart(ctx1, {
        type: 'line',
        data: {
            labels: [], 
            datasets: [
                {
                    label: 'Grid Power (W)',
                    data: [], 
                    borderColor: '#3498db',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: {
                        target: 'origin',
                        above: 'rgba(52, 152, 219, 0.1)', 
                        below: 'rgba(231, 76, 60, 0.3)'   
                    }
                },
                {
                    label: 'Setpoint (W)',
                    data: [], 
                    borderColor: '#f1c40f', 
                    borderWidth: 1,
                    borderDash: [5, 5], 
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { grid: { color: '#2d2d2d' }, ticks: { color: '#a0a0a0', maxTicksLimit: 6 } },
                y: { grid: { color: '#2d2d2d' }, ticks: { color: '#a0a0a0', callback: value => value + ' W' } }
            },
            plugins: { legend: { labels: { color: '#e0e0e0' } } }
        }
    });

    const ctx2 = document.getElementById('ecoChart').getContext('2d');
    const ecoChart = new Chart(ctx2, {
        type: 'line',
        data: {
            labels: [], 
            datasets: [
                {
                    label: 'PV-Power (W)',
                    data: [], 
                    borderColor: '#f1c40f',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    yAxisID: 'y'
                },
                {
                    label: 'Battery (%)',
                    data: [], 
                    borderColor: '#2ecc71',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    yAxisID: 'y1'
                }
            ]
        },
      options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { 
                    grid: { color: '#2d2d2d' }, 
                    ticks: { color: '#a0a0a0', maxTicksLimit: 6 } 
                },
                y: { 
                    type: 'linear', 
                    display: true, 
                    position: 'left',
                    min: 0,
                    grid: { color: '#2d2d2d' }, 
                    ticks: { color: '#a0a0a0', callback: value => value + ' W' } 
                },
                y1: { 
                    type: 'linear', 
                    display: true, 
                    position: 'right',
                    min: 0, 
                    max: 100,
                    grid: { drawOnChartArea: false }, 
                    ticks: { color: '#a0a0a0', callback: value => value + ' %' } 
                }
            },
            plugins: { legend: { labels: { color: '#e0e0e0' } } }
        }
    });

    async function updateDashboard() {
        try {
            const response = await fetch(dataUrl);
            if (!response.ok) throw new Error('Netzwerk-Fehler');
            
            const rawData = await response.json();
            const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const meter = rawData.smartMeter || {};
            const eco = rawData.ecoflow || {};
            const targetWatts = rawData.ecoflowTargetWatts || 0;
            const targetSetpoint = (rawData.targetSetpoint || 0) * -1;

            document.getElementById('serial').innerText = meter.serial_number || 'Unbekannt';
            document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();

            const currentPowerEl = document.getElementById('current-power');
            const power = meter.current_power_w || 0;
            currentPowerEl.innerText = power.toFixed(1) + ' W';
            currentPowerEl.className = 'value';
            
            if (power < 0) {
                currentPowerEl.classList.add('delivery');
            } else {
                currentPowerEl.classList.add('consumption');
            }

            document.getElementById('pv-power').innerText = (eco.pv_power_w || 0) + ' W';
            document.getElementById('battery-soc').innerText = (eco.battery_soc || 0) + ' %';

            document.getElementById('power-l1').innerText = (meter.power_L1_w || 0).toFixed(1) + ' W';
            document.getElementById('power-l2').innerText = (meter.power_L2_w || 0).toFixed(1) + ' W';
            document.getElementById('power-l3').innerText = (meter.power_L3_w || 0).toFixed(1) + ' W';
            document.getElementById('total-consumption').innerText = (meter.total_consumption_kwh || 0).toFixed(2) + ' kWh';

            historyChart.data.labels.push(nowStr);
            historyChart.data.datasets[0].data.push(power); 
            historyChart.data.datasets[1].data.push(targetSetpoint);

            ecoChart.data.labels.push(nowStr);
            ecoChart.data.datasets[0].data.push(eco.pv_power_w || 0); 
            ecoChart.data.datasets[1].data.push(eco.battery_soc || 0);

            if (historyChart.data.labels.length > MAX_DATA_POINTS) {
                historyChart.data.labels.shift();
                historyChart.data.datasets[0].data.shift();
                historyChart.data.datasets[1].data.shift();
                
                ecoChart.data.labels.shift();
                ecoChart.data.datasets[0].data.shift();
                ecoChart.data.datasets[1].data.shift();
            }

            historyChart.update('none'); 
            ecoChart.update('none');

        } catch (error) {
            document.getElementById('current-power').innerText = 'Error';
            document.getElementById('current-power').className = 'value loading';
        }
    }

    updateDashboard();
    setInterval(updateDashboard, 2000);
</script>

</body>
</html>
